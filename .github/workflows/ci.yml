name: CI

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # SwiftLint loads sourcekit from the selected toolchain, so it needs a
      # valid DEVELOPER_DIR. Selecting the newest installed Xcode rather than
      # pinning a path keeps this working across runner-image updates; the
      # version is printed so a toolchain change is visible in the log.
      - name: Select Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Install tools
        run: brew install swiftlint swiftformat

      - name: Check formatting
        run: swiftformat --lint .

      - name: Lint
        run: swiftlint lint --strict

  test:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          swift --version

      - name: Install tools
        run: brew install xcodegen

      # The package tests are where the coverage actually is, and they run on
      # the host with no simulator, so they are fast and not tied to whatever
      # runtimes the runner image happens to ship.
      - name: Test packages
        run: make test-packages

      - name: Generate project
        run: make project

      # A generic destination compile-checks both app targets without resolving
      # a concrete simulator, which is the part that depends on the runner's
      # installed runtimes.
      #
      # The app-scheme tests (`make test`) are deliberately NOT run here for
      # now: they need a booted simulator, which is slow and couples CI to the
      # runner image's iOS runtimes. Run them locally with `make test`. To
      # re-enable, add a step that resolves a device UDID from
      # `xcrun simctl list devices available` and pass it as
      # DESTINATION="platform=iOS Simulator,id=<udid>".
      - name: Build both app schemes
        run: make build DESTINATION="generic/platform=iOS Simulator"
