# SwiftLint configuration for lactic-ios.
# Run `make lint`. CI runs the same command with --strict.

included:
  - Apps
  - Packages

excluded:
  - "**/.build"
  - DerivedData

analyzer_rules:
  - unused_import

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

disabled_rules:
  # SwiftUI view bodies are legitimately long and deeply nested; the compiler
  # already pushes back when they get genuinely unmanageable.
  - type_body_length
  - function_body_length
  # SwiftFormat owns formatting and is configured with `--commas always`, which
  # keeps multi-line collection diffs to one line per change. SwiftLint owns
  # correctness rules; where the two overlap, SwiftFormat wins.
  - trailing_comma
  # Fires on `String(decoding:as: UTF8.self)`, which is the non-failable
  # standard-library API and the right one for asserting on an encoded body.
  # The suggested `String(bytes:encoding:)` only adds an optional to unwrap.
  - optional_data_string_conversion

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length: 2
  excluded: [id, x, y, i, to, kg]

type_name:
  min_length: 3

nesting:
  type_level: 3

force_cast: error
force_try: error
force_unwrapping: error
